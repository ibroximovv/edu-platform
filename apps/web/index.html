<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a58e6" />
    <meta name="description" content="Bilimdon — universitet uchun zamonaviy o'quv boshqaruv platformasi" />
    <title>Bilimdon — Universitet platformasi</title>
    <script>
      // Prevent theme flash before React mounts
      try {
        var t = JSON.parse(localStorage.getItem('edu-ui') || '{}').state?.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
